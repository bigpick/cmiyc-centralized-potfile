<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" aria-label="cmiyc-pool data flow">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a4271b"/>
    </marker>
  </defs>

  <!-- light panel so it reads in both GitHub themes -->
  <rect x="4" y="4" width="1112" height="392" rx="14" fill="#faf6ec" stroke="#e2d7bd" stroke-width="2"/>

  <!-- boxes -->
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- teammates -->
    <rect x="40" y="150" width="210" height="100" rx="10" fill="#f3ecd9" stroke="#8a8272" stroke-width="2"/>
    <text x="145" y="192" text-anchor="middle" font-size="20" font-weight="700" fill="#26221d">TEAMMATES</text>
    <text x="145" y="218" text-anchor="middle" font-size="14" font-family="'Courier New', monospace" fill="#6b7a8f">hashcat potfiles</text>

    <!-- pool -->
    <rect x="330" y="140" width="230" height="120" rx="10" fill="#f3ecd9" stroke="#a4271b" stroke-width="3"/>
    <text x="445" y="182" text-anchor="middle" font-size="21" font-weight="800" fill="#26221d">POOL</text>
    <text x="445" y="206" text-anchor="middle" font-size="13" font-family="'Courier New', monospace" fill="#6b7a8f">serve on Railway</text>
    <text x="445" y="226" text-anchor="middle" font-size="13" font-family="'Courier New', monospace" fill="#6b7a8f">dedupe + attribution</text>

    <!-- operator -->
    <rect x="640" y="140" width="210" height="120" rx="10" fill="#f3ecd9" stroke="#8a8272" stroke-width="2"/>
    <text x="745" y="182" text-anchor="middle" font-size="20" font-weight="700" fill="#26221d">OPERATOR</text>
    <text x="745" y="206" text-anchor="middle" font-size="13" font-family="'Courier New', monospace" fill="#6b7a8f">local machine</text>
    <text x="745" y="226" text-anchor="middle" font-size="13" font-family="'Courier New', monospace" fill="#6b7a8f">PGP keys + email</text>

    <!-- korelogic -->
    <rect x="930" y="150" width="150" height="100" rx="10" fill="#e7dcc2" stroke="#8a8272" stroke-width="2"/>
    <text x="1005" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#26221d">KORELOGIC</text>
    <text x="1005" y="216" text-anchor="middle" font-size="13" font-family="'Courier New', monospace" fill="#6b7a8f">autoresponder</text>
  </g>

  <!-- arrows -->
  <g stroke="#a4271b" stroke-width="3" fill="none">
    <line x1="252" y1="200" x2="326" y2="200" marker-end="url(#arrow)"/>
    <line x1="562" y1="200" x2="636" y2="200" marker-end="url(#arrow)"/>
    <line x1="852" y1="200" x2="926" y2="200" marker-end="url(#arrow)"/>
    <!-- mark: operator back to pool, routed below -->
    <path d="M745,260 L745,340 L445,340 L445,262" marker-end="url(#arrow)"/>
  </g>

  <!-- arrow labels -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="289" y="184" font-size="15" font-weight="700" fill="#a4271b">send</text>
    <text x="289" y="228" font-size="11" font-family="'Courier New', monospace" fill="#8a8272">idempotent</text>

    <text x="599" y="184" font-size="15" font-weight="700" fill="#a4271b">pull</text>
    <text x="599" y="228" font-size="11" font-family="'Courier New', monospace" fill="#8a8272">read-only</text>

    <text x="889" y="184" font-size="15" font-weight="700" fill="#a4271b">submit</text>
    <text x="889" y="228" font-size="11" font-family="'Courier New', monospace" fill="#8a8272">PGP email</text>

    <text x="595" y="332" font-size="15" font-weight="700" fill="#a4271b">mark</text>
    <text x="595" y="366" font-size="12" font-family="'Courier New', monospace" fill="#8a8272">only after a confirmed send</text>
  </g>

  <!-- trust note -->
  <text x="560" y="52" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#6b7a8f">secrets stay on the operator machine  //  the pool holds deduped cracks only</text>
</svg>
