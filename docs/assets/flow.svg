<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" aria-label="cmiyc-pool data flow">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- light panel so it reads in both GitHub themes -->
  <rect x="4" y="4" width="1112" height="372" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="560" y="46" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#94a3b8">secrets stay on the operator machine // the pool holds deduped cracks only</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- teammates -->
    <rect x="40" y="150" width="210" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="145" y="192" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Teammates</text>
    <text x="145" y="218" text-anchor="middle" font-size="13" font-family="'Courier New', monospace" fill="#64748b">hashcat potfiles</text>

    <!-- pool (emphasis) -->
    <rect x="330" y="140" width="230" height="120" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="2.5"/>
    <text x="445" y="182" text-anchor="middle" font-size="21" font-weight="800" fill="#0f172a">Pool</text>
    <text x="445" y="206" text-anchor="middle" font-size="12" font-family="'Courier New', monospace" fill="#64748b">serve on Railway</text>
    <text x="445" y="226" text-anchor="middle" font-size="12" font-family="'Courier New', monospace" fill="#64748b">dedupe + attribution</text>

    <!-- operator -->
    <rect x="640" y="140" width="210" height="120" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="745" y="182" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Operator</text>
    <text x="745" y="206" text-anchor="middle" font-size="12" font-family="'Courier New', monospace" fill="#64748b">local machine</text>
    <text x="745" y="226" text-anchor="middle" font-size="12" font-family="'Courier New', monospace" fill="#64748b">PGP keys + email</text>

    <!-- korelogic -->
    <rect x="930" y="150" width="150" height="100" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1005" y="192" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">KoreLogic</text>
    <text x="1005" y="216" text-anchor="middle" font-size="12" font-family="'Courier New', monospace" fill="#64748b">autoresponder</text>
  </g>

  <!-- arrows -->
  <g stroke="#4f46e5" stroke-width="2.5" fill="none">
    <line x1="252" y1="200" x2="326" y2="200" marker-end="url(#arrow)"/>
    <line x1="562" y1="200" x2="636" y2="200" marker-end="url(#arrow)"/>
    <line x1="852" y1="200" x2="926" y2="200" marker-end="url(#arrow)"/>
    <path d="M745,260 L745,340 L445,340 L445,262" marker-end="url(#arrow)"/>
  </g>

  <!-- arrow labels -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="289" y="184" font-size="15" font-weight="700" fill="#4f46e5">send</text>
    <text x="289" y="228" font-size="11" font-family="'Courier New', monospace" fill="#94a3b8">idempotent</text>

    <text x="599" y="184" font-size="15" font-weight="700" fill="#4f46e5">pull</text>
    <text x="599" y="228" font-size="11" font-family="'Courier New', monospace" fill="#94a3b8">read-only</text>

    <text x="889" y="184" font-size="15" font-weight="700" fill="#4f46e5">submit</text>
    <text x="889" y="228" font-size="11" font-family="'Courier New', monospace" fill="#94a3b8">PGP email</text>

    <text x="595" y="332" font-size="15" font-weight="700" fill="#4f46e5">mark</text>
    <text x="595" y="366" font-size="12" font-family="'Courier New', monospace" fill="#94a3b8">only after a confirmed send</text>
  </g>
</svg>
